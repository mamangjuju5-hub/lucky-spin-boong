<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Spin Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090714;
  color: white;
  font-family: Arial, sans-serif;
}

.wrap {
  max-width: 520px;
  margin: auto;
  padding: 18px;
}

h1 {
  text-align: center;
  color: #ffd43b;
  margin-bottom: 18px;
}

.card {
  background: #17102d;
  border: 1px solid #382365;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
}

.balance {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 18px;
}

.balance b {
  color: #ffd43b;
}

/* REEL */
.reels {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  background: #2b1257;
  padding: 10px;
  border-radius: 16px;
}

.cell {
  height: 82px;
  background: #120b22;
  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 42px;
}

/* INPUT */
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

label {
  font-size: 13px;
  color: #bbb;
}

input {
  width: 100%;
  padding: 12px;

  border-radius: 10px;
  border: 1px solid #493477;

  background: #0d0918;
  color: white;

  font-size: 16px;
  margin-top: 5px;
}

/* BUTTON */
button {
  border: 0;
  border-radius: 12px;
  padding: 13px;

  font-weight: bold;
  font-size: 16px;

  cursor: pointer;
}

#spin {
  background: #ffd43b;
  color: #17100d;
}

.secondary {
  background: #3a2464;
  color: white;
}

.danger {
  background: #8e2341;
  color: white;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;

  margin-top: 12px;
}

.result {
  text-align: center;
  min-height: 26px;

  color: #ffd43b;
  font-weight: bold;

  margin-top: 12px;
}

.status {
  text-align: center;
  margin-top: 10px;
  color: #9fe3a6;
}

.small {
  color: #aaa;
  font-size: 12px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="wrap">

<h1>🎰 LUCKY SPIN DEMO</h1>

<!-- SALDO -->
<div class="card balance">
  <span>Saldo Virtual</span>
  <b id="balance">100.000</b>
</div>

<!-- SLOT -->
<div class="card">

  <div class="reels" id="reels">

    <div class="cell">🍒</div>
    <div class="cell">💎</div>
    <div class="cell">⭐</div>

    <div class="cell">7️⃣</div>
    <div class="cell">🔔</div>
    <div class="cell">🍀</div>

    <div class="cell">🍋</div>
    <div class="cell">🍇</div>
    <div class="cell">🎁</div>

  </div>

  <div class="result" id="result">
    Tekan SPIN untuk bermain
  </div>

</div>

<!-- PENGATURAN -->
<div class="card">

  <div class="controls">

    <div>

      <label>
        Taruhan per spin
      </label>

      <input
        id="bet"
        type="number"
        min="100"
        step="100"
        value="1000"
      >

    </div>


    <div>

      <label>
        Budget sesi
      </label>

      <input
        id="budget"
        type="number"
        min="100"
        step="100"
        value="10000"
      >

    </div>

  </div>


  <div class="actions">

    <button id="spin">
      SPIN
    </button>

    <button
      class="secondary"
      id="auto"
    >
      AUTO SPIN: OFF
    </button>

  </div>


  <button
    class="danger"
    id="reset"
    style="width:100%;margin-top:10px"
  >
    RESET SALDO
  </button>


  <div
    class="status"
    id="status"
  ></div>

</div>


<div class="card small">

  Ini hanya game demo dengan poin virtual.
  Tidak ada uang asli, deposit, penarikan,
  atau hadiah uang.

</div>

</div>


<script>

/* =========================
   DATA GAME
========================= */

const symbols = [

  "🍒",
  "💎",
  "⭐",
  "7️⃣",
  "🔔",
  "🍀",
  "🍋",
  "🍇",
  "🎁"

];


/*
   Nilai kemenangan
*/

const payouts = {

  "🍒": 3,
  "💎": 8,
  "⭐": 5,
  "7️⃣": 10,
  "🔔": 4,
  "🍀": 6,
  "🍋": 3,
  "🍇": 4,
  "🎁": 12

};


/* =========================
   VARIABEL
========================= */

let balance = 100000;

let auto = false;

let timer = null;

let sessionSpent = 0;


/* =========================
   HELPER
========================= */

const $ = id => {

  return document.getElementById(id);

};


function fmt(number) {

  return new Intl.NumberFormat(
    "id-ID"
  ).format(number);

}


/* =========================
   UPDATE TAMPILAN
========================= */

function update() {

  $("balance").textContent =
    fmt(balance);

  $("auto").textContent =
    `AUTO SPIN: ${auto ? "ON" : "OFF"}`;

}


/* =========================
   SPIN
========================= */

function spin() {

  const bet =
    Math.floor(
      Number($("bet").value)
    );

  const budget =
    Math.floor(
      Number($("budget").value)
    );


  /* Cek taruhan */

  if (!bet || bet < 100) {

    $("result").textContent =
      "Taruhan minimal 100 poin virtual.";

    return;

  }


  /* Cek saldo */

  if (bet > balance) {

    $("result").textContent =
      "Saldo virtual tidak cukup.";

    stopAuto();

    return;

  }


  /* Cek budget */

  if (
    sessionSpent + bet >
    budget
  ) {

    $("result").textContent =
      "Spin ini melewati budget sesi.";

    stopAuto();

    return;

  }


  /* Kurangi saldo */

  balance -= bet;

  sessionSpent += bet;


  /* Ambil kotak reel */

  const cells =
    [
      ...document.querySelectorAll(".cell")
    ];


  /* Acak simbol */

  const values =
    cells.map(() => {

      const random =
        Math.floor(
          Math.random() *
          symbols.length
        );

      return symbols[random];

    });


  /* Tampilkan */

  cells.forEach(
    (cell, index) => {

      cell.textContent =
        values[index];

    }
  );


  /* =========================
     HITUNG KEMENANGAN
  ========================= */

  let win = 0;


  /*
     Cek 3 baris
  */

  for (
    let row = 0;
    row < 3;
    row++
  ) {

    const a =
      values[row * 3];

    const b =
      values[row * 3 + 1];

    const c =
      values[row * 3 + 2];


    if (
      a === b &&
      b === c
    ) {

      win +=
        bet * payouts[a];

    }

  }


  /*
     Bonus jika dua simbol
     tengah sama
  */

  if (
    values[3] === values[4] ||
    values[4] === values[5]
  ) {

    win += bet;

  }


  /* Tambahkan kemenangan */

  balance += win;


  /* =========================
     HASIL
  ========================= */

  if (win > 0) {

    $("result").textContent =
      `🎉 MENANG +${fmt(win)} poin virtual!`;

  } else {

    $("result").textContent =
      `Tidak menang. -${fmt(bet)} poin virtual`;

  }


  $("status").textContent =
    `Terpakai: ${fmt(sessionSpent)} / ${fmt(budget)} poin`;


  update();


  /* Stop kalau budget habis */

  if (
    balance < 100 ||
    sessionSpent >= budget
  ) {

    stopAuto();

  }

}


/* =========================
   AUTO SPIN
========================= */

function startAuto() {

  if (auto) return;


  auto = true;

  /*
     Mulai budget baru
  */

  sessionSpent = 0;


  $("status").textContent =
    "Auto spin berjalan...";


  update();


  /*
     Spin setiap 0,9 detik
  */

  timer =
    setInterval(
      spin,
      900
    );

}


/* =========================
   STOP AUTO
========================= */

function stopAuto() {

  auto = false;


  clearInterval(timer);

  timer = null;


  update();

}


/* =========================
   TOMBOL SPIN
========================= */

$("spin").onclick =
  spin;


/* =========================
   TOMBOL AUTO
========================= */

$("auto").onclick =
  () => {

    if (auto) {

      stopAuto();

    } else {

      startAuto();

    }

  };


/* =========================
   RESET
========================= */

$("reset").onclick =
  () => {

    stopAuto();

    balance = 100000;

    sessionSpent = 0;


    $("result").textContent =
      "Saldo direset.";


    $("status").textContent =
      "";


    update();

  };


/* =========================
   MULAI
========================= */

update();

</script>

</body>
</html>
