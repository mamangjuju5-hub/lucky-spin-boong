<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Spin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090b20;
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

.top {
  background: linear-gradient(#292b55, #11132d);
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #ffd83d;
}

.balance {
  background: #171936;
  border: 2px solid #d8a928;
  border-radius: 20px;
  padding: 7px 14px;
  color: #ffd83d;
  font-weight: bold;
}

.game {
  max-width: 650px;
  margin: auto;
  padding: 15px;
}

.title {
  text-align: center;
  font-size: 28px;
  color: #ffd83d;
  margin: 15px 0;
}

.machine {
  padding: 15px;
  border-radius: 18px;
  background: linear-gradient(135deg, #31106e, #120c38);
  border: 4px solid #d5a92e;
  box-shadow: 0 0 25px #000;
}

.reels {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  background: #09091b;
  padding: 7px;
  border-radius: 10px;
}

.reel {
  height: 105px;
  background: linear-gradient(#241c57, #100d2d);
  border: 2px solid #7051c8;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 43px;
  border-radius: 7px;
}

.spinning {
  animation: shake .12s infinite;
}

@keyframes shake {
  0% { transform: translateY(-4px); }
  50% { transform: translateY(4px); }
  100% { transform: translateY(-4px); }
}

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 14px;
}

.control {
  background: #171936;
  border: 2px solid #6254a5;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  flex: 1;
}

.control small {
  display: block;
  color: #aaa;
}

.control strong {
  color: #ffd83d;
  font-size: 18px;
}

button {
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.minus,
.plus {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #d5a92e;
  font-size: 20px;
}

.spin {
  margin-top: 15px;
  width: 100%;
  padding: 17px;
  border-radius: 15px;
  background: linear-gradient(#ffe75a, #e5a91c);
  color: #17120a;
  font-size: 25px;
  box-shadow: 0 5px 0 #8d6410;
}

.spin:disabled {
  opacity: .5;
}

.reset {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  background: #292944;
  color: white;
}

.result {
  text-align: center;
  min-height: 35px;
  margin: 18px 0 5px;
  font-size: 20px;
  font-weight: bold;
}

.paytable {
  margin-top: 20px;
  background: #11132c;
  padding: 15px;
  border-radius: 12px;
}

.paytable h2 {
  margin-top: 0;
  color: #ffd83d;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #29294a;
}

.note {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin: 20px 0;
}
</style>
</head>

<body>

<div class="top">
  <div class="logo">🎰 LUCKY SPIN</div>
  <div class="balance">
    💰 <span id="balance">10000</span>
  </div>
</div>

<div class="game">

  <div class="title">LUCKY SPIN</div>

  <div class="machine">

    <div class="reels">
      <div class="reel" id="r1">🍒</div>
      <div class="reel" id="r2">💎</div>
      <div class="reel" id="r3">7️⃣</div>
      <div class="reel" id="r4">🍋</div>
      <div class="reel" id="r5">🔔</div>
    </div>

    <div class="controls">

      <button class="minus" onclick="ubahBet(-10)">−</button>

      <div class="control">
        <small>BET</small>
        <strong id="bet">100</strong>
      </div>

      <button class="plus" onclick="ubahBet(10)">+</button>

      <div class="control">
        <small>WIN</small>
        <strong id="win">0</strong>
      </div>

    </div>

    <button class="spin" id="spinButton" onclick="spin()">
      SPIN 🎰
    </button>

    <button class="reset" onclick="resetGame()">
      RESET DEMO
    </button>

    <div class="result" id="result">
      Tekan SPIN untuk bermain!
    </div>

  </div>

  <div class="paytable">

    <h2>🏆 PAYTABLE DEMO</h2>

    <div class="row">
      <span>7️⃣ 7️⃣ 7️⃣</span>
      <strong>× 50</strong>
    </div>

    <div class="row">
      <span>💎 💎 💎</span>
      <strong>× 25</strong>
    </div>

    <div class="row">
      <span>⭐ ⭐ ⭐</span>
      <strong>× 15</strong>
    </div>

    <div class="row">
      <span>🍒 🍒 🍒</span>
      <strong>× 10</strong>
    </div>

    <div class="row">
      <span>🍋 🍋 🍋</span>
      <strong>× 8</strong>
    </div>

    <div class="row">
      <span>🔔 🔔 🔔</span>
      <strong>× 5</strong>
    </div>

  </div>

  <div class="note">
    Lucky Spin adalah game demo menggunakan poin virtual.
  </div>

</div>

<script>

const symbols = [
  "🍒",
  "🍋",
  "🔔",
  "💎",
  "⭐",
  "🍀",
  "7️⃣"
];

let balance = 10000;
let bet = 100;
let spinning = false;

const reels = [
  document.getElementById("r1"),
  document.getElementById("r2"),
  document.getElementById("r3"),
  document.getElementById("r4"),
  document.getElementById("r5")
];

function randomSymbol() {
  return symbols[Math.floor(Math.random() * symbols.length)];
}

function updateScreen() {
  document.getElementById("balance").textContent = balance;
  document.getElementById("bet").textContent = bet;
}

function ubahBet(jumlah) {

  if (spinning) return;

  bet += jumlah;

  if (bet < 10) bet = 10;
  if (bet > 1000) bet = 1000;

  updateScreen();
}

function spin() {

  if (spinning) return;

  if (balance < bet) {
    document.getElementById("result").textContent =
      "❌ Poin virtual tidak cukup.";
    return;
  }

  spinning = true;

  balance -= bet;
  updateScreen();

  document.getElementById("win").textContent = "0";

  const button = document.getElementById("spinButton");
  button.disabled = true;

  reels.forEach(reel => {
    reel.classList.add("spinning");
  });

  document.getElementById("result").textContent =
    "🎰 Gulungan berputar...";

  let counter = 0;

  const animation = setInterval(() => {

    reels.forEach(reel => {
      reel.textContent = randomSymbol();
    });

    counter++;

    if (counter >= 20) {

      clearInterval(animation);

      reels.forEach(reel => {
        reel.classList.remove("spinning");
      });

      selesaiSpin();
    }

  }, 100);
}

function selesaiSpin() {

  const hasil = [];

  reels.forEach(reel => {
    const symbol = randomSymbol();
    reel.textContent = symbol;
    hasil.push(symbol);
  });

  let multiplier = 0;

  // 5 simbol sama
  if (hasil.every(x => x === hasil[0])) {

    if (hasil[0] === "7️⃣") {
      multiplier = 50;
    } else if (hasil[0] === "💎") {
      multiplier = 25;
    } else if (hasil[0] === "⭐") {
      multiplier = 15;
    } else if (hasil[0] === "🍒") {
      multiplier = 10;
    } else if (hasil[0] === "🍋") {
      multiplier = 8;
    } else if (hasil[0] === "🔔") {
      multiplier = 5;
    } else {
      multiplier = 3;
    }
  }

  // 3 simbol pertama sama
  else if (
    hasil[0] === hasil[1] &&
    hasil[1] === hasil[2]
  ) {
    multiplier = 3;
  }

  const win = bet * multiplier;

  if (win > 0) {

    balance += win;

    document.getElementById("win").textContent = win;

    document.getElementById("result").textContent =
      "🎉 MENANG! +" + win + " poin!";

  } else {

    document.getElementById("win").textContent = "0";

    document.getElementById("result").textContent =
      "😅 Belum menang. Coba lagi!";
  }

  updateScreen();

  spinning = false;

  document.getElementById("spinButton").disabled = false;
}

function resetGame() {

  balance = 10000;
  bet = 100;

  reels[0].textContent = "🍒";
  reels[1].textContent = "💎";
  reels[2].textContent = "7️⃣";
  reels[3].textContent = "🍋";
  reels[4].textContent = "🔔";

  document.getElementById("win").textContent = "0";

  document.getElementById("result").textContent =
    "Game demo direset!";

  updateScreen();
}

updateScreen();

</script>

</body>
</html>
